name: Verificações de segurança
on:
  workflow_call:
  push:
    branches: [main, seguranca-visual-v3-1, hardening-backup-e-isolamento-v32]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check core.js
      - run: node --check insights.js
      - run: node --check security-center.js
      - run: node --check branding.js
      - run: node --check updater.js
      - run: node --check sw.js
      - run: node --check online-ranking.js
      - run: node --check subscriptions.js
      - run: node tests/security-audit.mjs
      - run: node --test tests/session-races.mjs tests/crypto-vault.mjs tests/restore-commit.mjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/browser-smoke.mjs
      - run: node tests/cloud-flow.mjs
      - run: node tests/responsive-layout.mjs
      - name: Guardar capturas de layout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-visual-responsive
          path: test-results/*.png
          if-no-files-found: ignore
