name: Publicar Rota Financeira
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  security:
    permissions:
      contents: read
    uses: ./.github/workflows/security-checks.yml
  database:
    permissions:
      contents: read
    uses: ./.github/workflows/postgres-security.yml
  deploy:
    needs: [security, database]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar somente arquivos públicos do aplicativo
        run: |
          mkdir -p public-site
          cp -- *.html *.js *.css *.svg manifest.webmanifest public-site/
          cp -- tutorial-rota-financeira.mp4 tutorial-poster.jpg public-site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - id: deployment
        uses: actions/deploy-pages@v4
